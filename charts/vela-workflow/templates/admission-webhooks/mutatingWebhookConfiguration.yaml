{{- if .Values.admissionWebhooks.enabled -}}
{{- $mName := printf "%s-admission" (include "kubevela.fullname" .) -}}
{{- $webhookName := "mutating.core.oam.dev.v1alpha1.workflowruns" -}}
{{- $hooks := include "kubevela.existingWebhooks" (dict "kind" "MutatingWebhookConfiguration" "name" $mName) | fromJson -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ template "kubevela.fullname" . }}-admission
  namespace: {{ .Release.Namespace }}
  {{- if .Values.admissionWebhooks.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s-root-cert" .Release.Namespace (include "kubevela.fullname" .) | quote }}
  {{- end }}
webhooks:
  - clientConfig:
      {{- include "kubevela.webhookCABundle" (dict "root" . "hooks" $hooks "name" $webhookName) | nindent 6 }}
      service:
        name: {{ template "kubevela.name" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutating-core-oam-dev-v1alpha1-workflowruns
    {{- include "kubevela.webhookFailurePolicy" (dict "root" . "hooks" $hooks "name" $webhookName "policy" "Fail") | nindent 4 }}
    name: {{ $webhookName }}
    timeoutSeconds: {{ .Values.admissionWebhookTimeout }}
    sideEffects: None
    rules:
      - apiGroups:
          - core.oam.dev
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - workflowruns
        scope: Namespaced
    admissionReviewVersions:
      - v1beta1
      - v1

{{- end -}}
