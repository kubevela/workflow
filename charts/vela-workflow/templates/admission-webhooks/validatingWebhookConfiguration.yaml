{{- if .Values.admissionWebhooks.enabled -}}
{{- $vName := printf "%s-admission" (include "kubevela.fullname" .) -}}
{{- $webhookName := "validating.core.oam.dev.v1alpha1.workflowruns" -}}
{{- $legacyWebhookName := "validating.core.oam.dev.v1alpha2.applicationconfigurations" -}}
{{- $hooks := include "kubevela.existingWebhooks" (dict "kind" "ValidatingWebhookConfiguration" "name" $vName) | fromJson -}}
{{- if and (not (hasKey $hooks $webhookName)) (hasKey $hooks $legacyWebhookName) -}}
{{- $_ := set $hooks $webhookName (get $hooks $legacyWebhookName) -}}
{{- end -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ template "kubevela.fullname" . }}-admission
  namespace: {{ .Release.Namespace }}
  {{- if .Values.admissionWebhooks.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s-root-cert" .Release.Namespace (include "kubevela.fullname" .) | quote }}
  {{- end }}
webhooks:
  - clientConfig:
      {{- include "kubevela.webhookCABundle" (dict "root" . "hooks" $hooks "name" $webhookName) | nindent 6 }}
      service:
        name: {{ template "kubevela.name" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validating-core-oam-dev-v1alpha1-workflowruns
    {{- if .Values.admissionWebhooks.certManager.enabled }}
    failurePolicy: {{ .Values.admissionWebhooks.failurePolicy }}
    {{- else }}
    {{- include "kubevela.webhookFailurePolicy" (dict "root" . "hooks" $hooks "name" $webhookName "policy" .Values.admissionWebhooks.failurePolicy) | nindent 4 }}
    {{- end }}
    name: {{ $webhookName }}
    sideEffects: None
    rules:
      - apiGroups:
          - core.oam.dev
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - workflowruns
        scope: Namespaced
    admissionReviewVersions:
      - v1beta1
      - v1
    timeoutSeconds: 5
{{- end -}}