name: Webhook Upgrade Validation

on:
  push:
    branches:
      - main
      - release-*
    tags:
      - v*
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
      - release-*

permissions:
  contents: read

env:
  GO_VERSION: '1.23.8'

jobs:
  webhook-upgrade-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Prepare pre-change chart
        run: |
          git fetch origin release-0.7 --depth=1
          git worktree add --detach "$RUNNER_TEMP/vela-workflow-baseline" FETCH_HEAD

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup K3d
        uses: nolar/setup-k3d-k3s@v1.0.8
        with:
          version: v1.31
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load image
        run: make image-load

      - name: Install vela-workflow baseline
        run: |
          helm upgrade --install \
            --create-namespace \
            --namespace vela-system \
            --set image.repository=oamdev/vela-workflow \
            --set image.tag=latest \
            --set image.pullPolicy=IfNotPresent \
            --wait \
            --timeout 3m \
            vela-workflow \
            "$RUNNER_TEMP/vela-workflow-baseline/charts/vela-workflow"

      - name: Verify baseline webhook state
        run: |
          echo "=== Baseline ValidatingWebhookConfiguration ==="
          VWH_CA=$(kubectl get validatingwebhookconfiguration vela-workflow-admission \
            -o jsonpath='{.webhooks[0].clientConfig.caBundle}')
          echo "caBundle length: ${#VWH_CA}"
          if [ "$VWH_CA" = "Cg==" ] || [ -z "$VWH_CA" ]; then
            echo "ERROR: Baseline caBundle is placeholder or empty"
            exit 1
          fi
          echo "caBundle is valid (not placeholder)"

          echo "=== Baseline MutatingWebhookConfiguration ==="
          MWH_CA=$(kubectl get mutatingwebhookconfiguration vela-workflow-admission \
            -o jsonpath='{.webhooks[0].clientConfig.caBundle}')
          echo "caBundle length: ${#MWH_CA}"
          if [ "$MWH_CA" = "Cg==" ] || [ -z "$MWH_CA" ]; then
            echo "ERROR: Baseline caBundle is placeholder or empty"
            exit 1
          fi
          echo "caBundle is valid (not placeholder)"

          SECRET_CA=$(kubectl get secret -n vela-system vela-workflow-admission \
            -o jsonpath='{.data.ca}')
          SECRET_CA_KEY=$(kubectl get secret -n vela-system vela-workflow-admission \
            -o jsonpath='{.data.ca\.key}')
          if [ -z "$SECRET_CA" ]; then
            echo "ERROR: Baseline Secret is missing its CA"
            exit 1
          fi
          if [ -n "$SECRET_CA_KEY" ]; then
            echo "ERROR: Baseline Job-created Secret unexpectedly contains ca.key"
            exit 1
          fi
          if kubectl get jobs -n vela-system -o name | grep -qE 'admission-(create|patch)'; then
            echo "ERROR: Legacy admission certificate Job exists"
            exit 1
          fi
          echo "BASELINE_CA=$SECRET_CA" >> "$GITHUB_ENV"

      - name: Upgrade and restart controller
        run: |
          helm upgrade --install \
            --namespace vela-system \
            --set image.repository=oamdev/vela-workflow \
            --set image.tag=latest \
            --set image.pullPolicy=IfNotPresent \
            --reuse-values \
            --wait \
            --timeout 3m \
            vela-workflow \
            ./charts/vela-workflow

          kubectl scale deployment/vela-workflow -n vela-system --replicas=0
          kubectl wait --for=delete pod \
            -l app.kubernetes.io/instance=vela-workflow \
            -n vela-system \
            --timeout=3m
          kubectl patch validatingwebhookconfiguration vela-workflow-admission \
            --type=json \
            -p='[{"op":"replace","path":"/webhooks/0/failurePolicy","value":"Ignore"}]'
          kubectl patch mutatingwebhookconfiguration vela-workflow-admission \
            --type=json \
            -p='[{"op":"replace","path":"/webhooks/0/failurePolicy","value":"Ignore"}]'
          kubectl scale deployment/vela-workflow -n vela-system --replicas=1
          kubectl rollout status deployment/vela-workflow -n vela-system --timeout=3m
          kubectl wait --for=jsonpath='{.webhooks[0].failurePolicy}'=Fail \
            validatingwebhookconfiguration/vela-workflow-admission \
            --timeout=30s
          kubectl wait --for=jsonpath='{.webhooks[0].failurePolicy}'=Fail \
            mutatingwebhookconfiguration/vela-workflow-admission \
            --timeout=30s

      - name: Dump webhook configurations
        if: ${{ always() }}
        run: |
          echo "=== ValidatingWebhookConfiguration ==="
          kubectl get validatingwebhookconfiguration vela-workflow-admission -o yaml
          echo "=== MutatingWebhookConfiguration ==="
          kubectl get mutatingwebhookconfiguration vela-workflow-admission -o yaml

      - name: Verify CA is reused after upgrade and restart
        run: |
          SECRET_CA=$(kubectl get secret -n vela-system vela-workflow-admission \
            -o jsonpath='{.data.ca}')
          if [ "$SECRET_CA" != "$BASELINE_CA" ]; then
            echo "FAIL: Runtime-managed CA changed after upgrade or restart"
            exit 1
          fi

          VWH_CA=$(kubectl get validatingwebhookconfiguration vela-workflow-admission \
            -o jsonpath='{.webhooks[0].clientConfig.caBundle}')
          MWH_CA=$(kubectl get mutatingwebhookconfiguration vela-workflow-admission \
            -o jsonpath='{.webhooks[0].clientConfig.caBundle}')
          if [ "$VWH_CA" != "$BASELINE_CA" ] || [ "$MWH_CA" != "$BASELINE_CA" ]; then
            echo "FAIL: Webhook caBundle does not match the Secret CA"
            exit 1
          fi
          VWH_POLICY=$(kubectl get validatingwebhookconfiguration vela-workflow-admission \
            -o jsonpath='{.webhooks[0].failurePolicy}')
          MWH_POLICY=$(kubectl get mutatingwebhookconfiguration vela-workflow-admission \
            -o jsonpath='{.webhooks[0].failurePolicy}')
          if [ "$VWH_POLICY" != "Fail" ] || [ "$MWH_POLICY" != "Fail" ]; then
            echo "FAIL: Controller did not restore failurePolicy after restart"
            exit 1
          fi
          echo "PASS: CA and failurePolicy survived upgrade and restart"

      - name: Cleanup k3d cluster
        if: ${{ always() }}
        run: k3d cluster delete || true
