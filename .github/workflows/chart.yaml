name: HelmChart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      overwrite_version:
        description: 'Version to overwrite (e.g. v0.6.3). Leave empty to fail if version already exists.'
        required: false
        default: ''

jobs:
  publish-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Get the vars
        id: vars
        run: |
          if [[ ${GITHUB_REF} == "refs/heads/main" ]]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          echo "GITVERSION=git-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Login ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Check image does not already exist
        run: |
          TAG=${{ steps.vars.outputs.TAG }}
          if [[ "$TAG" != "latest" ]]; then
            if docker manifest inspect docker.io/oamdev/vela-workflow:${TAG} > /dev/null 2>&1; then
              if [[ "${{ inputs.overwrite_version }}" != "$TAG" ]]; then
                echo "Image oamdev/vela-workflow:${TAG} already exists. Set overwrite_version=${TAG} to republish."
                exit 1
              fi
              echo "Image already exists but overwrite_version matches, continuing."
            fi
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        name: Build & Pushing vela-workflow for Dockerhub
        with:
          context: .
          file: ./Dockerfile
          labels: |-
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GOPROXY=https://proxy.golang.org
            VERSION=${{ steps.vars.outputs.TAG }}
            GIT_VERSION=${{ steps.vars.outputs.GITVERSION }}
          tags: |-
            docker.io/oamdev/vela-workflow:${{ steps.vars.outputs.TAG }}
            ghcr.io/${{ github.repository_owner }}/oamdev/vela-workflow:${{ steps.vars.outputs.TAG }}

  publish-charts:
    env:
      HELM_CHART: charts/vela-workflow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Get the vars
        id: vars
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.4.0
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '14'
      - uses: oprypin/find-latest-tag@6957ac556fa6d349727ecabfcaaf9f8e5ee37124 # v1.1.3
        with:
          repository: kubevela/workflow
          releases-only: true
        id: latest_tag
      - name: Tag helm chart image
        run: |
          latest_repo_tag=${{ steps.latest_tag.outputs.tag }}
          sub="."
          major="$(cut -d"$sub" -f1 <<<"$latest_repo_tag")"
          minor="$(cut -d"$sub" -f2 <<<"$latest_repo_tag")"
          patch="0"
          current_repo_tag="$major.$minor.$patch"
          image_tag=${GITHUB_REF#refs/tags/}
          chart_version=$image_tag
          if [[ ${GITHUB_REF} == "refs/heads/main" ]]; then
            image_tag=latest
            chart_version=${current_repo_tag}-nightly-build
          fi
          sed -i "s/latest/${image_tag}/g" $HELM_CHART/values.yaml
          chart_smever=${chart_version#"v"}
          sed -i "s/0.1.0/$chart_smever/g" $HELM_CHART/Chart.yaml

      - uses: jnwng/github-app-installation-token-action@c54add4c02866dc41e106745ac6dcf5cdd6339e5 # v2
        id: get_app_token
        with:
          appId: 340472
          installationId: 38064967
          privateKey: ${{ secrets.GH_KUBEVELA_APP_PRIVATE_KEY }}
      - name: Sync Chart Repo
        run: |
          git config --global user.email "135009839+kubevela[bot]@users.noreply.github.com"
          git config --global user.name "kubevela[bot]"
          git clone https://x-access-token:${{ steps.get_app_token.outputs.token }}@github.com/kubevela/charts.git kubevela-charts
          chart_version=${GITHUB_REF#refs/tags/}
          chart_semver=${chart_version#"v"}
          if ls kubevela-charts/docs/vela-workflow-${chart_semver}.tgz > /dev/null 2>&1; then
            if [[ "${{ inputs.overwrite_version }}" != "${chart_version}" ]]; then
              echo "Helm chart vela-workflow-${chart_semver} already exists. Set overwrite_version=${chart_version} to republish."
              exit 1
            fi
            echo "Chart already exists but overwrite_version matches, continuing."
          fi
          helm package $HELM_CHART --destination ./kubevela-charts/docs/
          helm repo index --url https://kubevela.github.io/charts ./kubevela-charts/docs/
          cd kubevela-charts/
          git add docs/
          chart_version=${GITHUB_REF#refs/tags/}
          git commit -m "update vela-workflow chart ${chart_version}"
          git push https://x-access-token:${{ steps.get_app_token.outputs.token }}@github.com/kubevela/charts.git      
